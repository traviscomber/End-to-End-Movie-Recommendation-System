<!DOCTYPE html>
<html>
<head>
	<title>Browse by Genre - Movie Finder</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='style.css') }}">
	<style>
		.category-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
			gap: 2rem;
			padding: 2rem;
			margin: 2rem 0;
		}

		.category-card {
			background: linear-gradient(135deg, rgba(229, 9, 20, 0.2), rgba(229, 9, 20, 0.05));
			border: 2px solid rgba(229, 9, 20, 0.3);
			border-radius: 1rem;
			padding: 2rem;
			text-align: center;
			cursor: pointer;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 200px;
		}

		.category-card:hover {
			transform: translateY(-8px) scale(1.05);
			border-color: var(--primary);
			background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(229, 9, 20, 0.15));
			box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
		}

		.category-icon {
			font-size: 3rem;
			color: var(--primary);
			margin-bottom: 1rem;
		}

		.category-name {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--text-primary);
		}

		.category-count {
			font-size: 0.85rem;
			color: var(--text-secondary);
			margin-top: 0.5rem;
		}

		.page-title {
			font-size: 3rem;
			color: var(--primary);
			margin: 3rem 0 1rem 0;
			text-align: center;
			font-weight: 700;
		}

		.page-subtitle {
			text-align: center;
			color: var(--text-secondary);
			margin-bottom: 2rem;
			font-size: 1.1rem;
		}

		.trending-section {
			margin-top: 4rem;
			margin-bottom: 4rem;
		}

		.trending-title {
			font-size: 2rem;
			color: var(--text-primary);
			margin-bottom: 1.5rem;
		}

		.movie-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
			gap: 1.5rem;
			padding: 1rem 0;
		}

		.movie-card {
			background: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(229, 9, 20, 0.2);
			border-radius: 0.75rem;
			overflow: hidden;
			transition: all 0.3s;
			cursor: pointer;
		}

		.movie-card:hover {
			transform: translateY(-6px);
			border-color: var(--primary);
			box-shadow: 0 15px 30px rgba(229, 9, 20, 0.2);
		}

		.movie-card-content {
			padding: 1rem;
		}

		.movie-card-title {
			color: var(--text-primary);
			font-weight: 600;
			font-size: 0.9rem;
			margin-bottom: 0.5rem;
			line-height: 1.3;
		}

		.movie-card-rating {
			color: var(--primary);
			font-size: 0.85rem;
		}

		.search-section {
			background: rgba(229, 9, 20, 0.1);
			border: 1px solid rgba(229, 9, 20, 0.2);
			border-radius: 1rem;
			padding: 2rem;
			margin-bottom: 3rem;
			margin-top: 2rem;
		}

		.search-container {
			display: flex;
			gap: 1rem;
			max-width: 600px;
			margin: 0 auto;
		}

		.search-input {
			flex: 1;
			background: rgba(20, 20, 20, 0.8);
			border: 1px solid rgba(229, 9, 20, 0.3);
			border-radius: 0.5rem;
			padding: 0.75rem 1rem;
			color: var(--text-primary);
			font-size: 1rem;
			transition: all 0.3s;
		}

		.search-input:focus {
			outline: none;
			border-color: var(--primary);
			box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
			background: rgba(20, 20, 20, 0.95);
		}

		.search-input::placeholder {
			color: var(--text-secondary);
		}

		.search-btn {
			background: var(--primary);
			color: white;
			border: none;
			border-radius: 0.5rem;
			padding: 0.75rem 1.5rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s;
		}

		.search-btn:hover {
			background: #e50819;
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
		}

		#searchResults {
			display: none;
			margin-top: 3rem;
			padding-top: 2rem;
			border-top: 1px solid rgba(229, 9, 20, 0.2);
		}

		.search-results-title {
			font-size: 1.75rem;
			color: var(--text-primary);
			margin-bottom: 1rem;
		}

		.results-section {
			margin-bottom: 3rem;
		}

		.results-section h3 {
			font-size: 1.25rem;
			color: var(--primary);
			margin-bottom: 1rem;
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}

</head>

<body id="content">
	<div class="ml-container">
		<!-- Header -->
		<button class="btn btn-secondary" style="margin-top: 1rem;" onclick="window.location.href='/'">
			<i class="fas fa-home"></i> Back to Home
		</button>

		<h1 class="page-title">
			<i class="fas fa-film"></i> Browse by Genre
		</h1>
		<p class="page-subtitle">Explore movies by category to find your next favorite</p>

		<!-- Search Section -->
		<div class="search-section">
			<div style="text-align: center; margin-bottom: 1.5rem;">
				<h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">Search Movies</h2>
				<p style="color: var(--text-secondary); font-size: 0.95rem;">Find a movie and get personalized recommendations</p>
			</div>
			<div class="search-container">
				<input type="text" class="search-input" id="searchInput" placeholder="Enter movie title, director, or actor..." autocomplete="off">
				<button class="search-btn" onclick="performSearch()">
					<i class="fas fa-search"></i> Search
				</button>
			</div>
		</div>

		<!-- Search Results -->
		<div id="searchResults"></div>

		<h1 class="page-title" style="margin-top: 3rem;">
			<i class="fas fa-film"></i> Browse by Genre
		</h1>
		<div class="category-grid" id="categoriesGrid">
			<div style="text-align: center; color: var(--text-secondary); grid-column: 1/-1;">
				Loading categories...
			</div>
		</div>

		<!-- Trending Movies Section -->
		<div class="trending-section">
			<h2 class="trending-title">
				<i class="fas fa-fire" style="color: #ff6b35;"></i> Trending Movies
			</h2>
			<div class="movie-grid" id="trendingGrid">
				<div style="text-align: center; color: var(--text-secondary); grid-column: 1/-1;">
					Loading trending movies...
				</div>
			</div>
		</div>
	</div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script>
		// Data caching system
		const DataCache = {
			data: null,
			timestamp: null,
			ttl: 5 * 60 * 1000, // 5 minutes
			
			set(data) {
				this.data = data;
				this.timestamp = Date.now();
				try {
					localStorage.setItem('categoriesCache', JSON.stringify({data, timestamp: this.timestamp}));
					console.log('[v0] Data cached:', {categories: data.categories.length, trending: data.trending.length});
				} catch(e) {
					console.warn('[v0] Cache write error:', e);
				}
			},
			
			get() {
				if (!this.data) {
					try {
						const cached = JSON.parse(localStorage.getItem('categoriesCache'));
						if (cached && (Date.now() - cached.timestamp < this.ttl)) {
							this.data = cached.data;
							this.timestamp = cached.timestamp;
							console.log('[v0] Using cached data');
							return this.data;
						}
					} catch(e) {
						console.warn('[v0] Cache read error:', e);
					}
				}
				return this.data;
			},
			
			isValid() {
				return this.data && (Date.now() - this.timestamp < this.ttl);
			}
		};

		// Load categories and trending on page load
		document.addEventListener('DOMContentLoaded', function() {
			console.log('[v0] Page loaded, fetching categories and trending');
			loadCategoriesAndTrending();
		});

		// Optimized combined data fetch
		function loadCategoriesAndTrending() {
			// Check cache first
			if (DataCache.isValid()) {
				console.log('[v0] Cache valid, using cached data');
				const cached = DataCache.get();
				loadCategoriesGrid(cached.categories);
				loadTrendingGrid(cached.trending);
				return;
			}

			console.log('[v0] Cache invalid or empty, fetching from server');
			const startTime = performance.now();
			
			// Show loading state
			document.getElementById('categoriesGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Loading categories...</div>';
			document.getElementById('trendingGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Loading trending movies...</div>';

			fetch('/api/categories-and-trending')
				.then(response => {
					if (!response.ok) throw new Error('Failed to fetch');
					return response.json();
				})
				.then(data => {
					const endTime = performance.now();
					console.log('[v0] Data fetched in', (endTime - startTime).toFixed(2), 'ms');
					console.log('[v0] Response:', {categories: data.categories.length, trending: data.trending.length});
					
					// Cache the data
					DataCache.set(data);
					
					// Display data
					loadCategoriesGrid(data.categories);
					loadTrendingGrid(data.trending);
				})
				.catch(error => {
					console.error('[v0] Error loading data:', error);
					document.getElementById('categoriesGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--error);">Failed to load categories</div>';
					document.getElementById('trendingGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--error);">Failed to load trending movies</div>';
				});
		}

		// Load categories into grid
		function loadCategoriesGrid(categories) {
			const grid = document.getElementById('categoriesGrid');
			grid.innerHTML = '';
			
			if (!categories || categories.length === 0) {
				grid.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1;">No categories found</p>';
				return;
			}

			categories.forEach(category => {
				const card = document.createElement('div');
				card.className = 'category-card';
				
				let icon = 'fa-tag';
				const catLower = category.toLowerCase();
				if (catLower.includes('action')) icon = 'fa-bomb';
				else if (catLower.includes('comedy')) icon = 'fa-face-laugh';
				else if (catLower.includes('horror')) icon = 'fa-skull';
				else if (catLower.includes('romance')) icon = 'fa-heart';
				else if (catLower.includes('drama')) icon = 'fa-masks-theater';
				else if (catLower.includes('sci-fi')) icon = 'fa-rocket';
				else if (catLower.includes('tubi') || catLower.includes('b-movie')) icon = 'fa-film';
				else if (catLower.includes('indie') || catLower.includes('gems')) icon = 'fa-star';
				
				card.innerHTML = `
					<div class="category-icon">
						<i class="fas ${icon}"></i>
					</div>
					<div class="category-name">${category}</div>
					<div class="category-count">Explore</div>
				`;
				card.onclick = () => viewGenre(category);
				grid.appendChild(card);
			});
			
			console.log('[v0] Categories displayed:', categories.length);
		}

		// Load trending into grid
		function loadTrendingGrid(movies) {
			const grid = document.getElementById('trendingGrid');
			grid.innerHTML = '';
			
			if (!movies || movies.length === 0) {
				document.querySelector('.trending-section').style.display = 'none';
				return;
			}

			movies.forEach(movie => {
				const card = document.createElement('div');
				card.className = 'movie-card';
				const movieTitle = movie.movie_title || movie.title || 'Unknown';
				const rating = movie.imdb_score || movie.rating || 0;
				card.innerHTML = `
					<div class="movie-card-content">
						<div class="movie-card-title">${movieTitle}</div>
						<div class="movie-card-rating">
							<i class="fas fa-star"></i> ${rating}/10
						</div>
					</div>
				`;
				grid.appendChild(card);
			});
			
			console.log('[v0] Trending movies displayed:', movies.length);
		}

		function viewGenre(genre) {
			console.log('[v0] Viewing genre:', genre);
			
			// Hide categories section
			document.getElementById('categoriesGrid').style.display = 'none';
			document.querySelector('.trending-section').style.display = 'none';
			
			// Get the main container
			const container = document.querySelector('.ml-container');
			
			// Create movies display section
			let moviesSection = document.getElementById('moviesSection');
			if (!moviesSection) {
				moviesSection = document.createElement('div');
				moviesSection.id = 'moviesSection';
				container.insertBefore(moviesSection, document.getElementById('categoriesGrid'));
			}
			
			// Show loading state
			moviesSection.innerHTML = `
				<button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="backToCategories()">
					<i class="fas fa-arrow-left"></i> Back to Categories
				</button>
				<h1 class="page-title" style="margin-bottom: 0.5rem;">
					<i class="fas fa-film"></i> ${genre}
				</h1>
				<div style="text-align: center; padding: 2rem;">
					<div class="spinner-border text-primary"></div>
					<p style="margin-top: 1rem; color: var(--text-secondary);">Loading ${genre} movies...</p>
				</div>
			`;
			moviesSection.style.display = 'block';
			
			// Fetch movies for this genre
			fetch(`/api/movies-by-genre/${encodeURIComponent(genre)}`)
				.then(response => response.json())
				.then(data => {
					console.log('[v0] Loaded movies:', data.movies ? data.movies.length : 0);
					
					if (data.movies && data.movies.length > 0) {
						displayGenreMovies(moviesSection, genre, data.movies, data.source);
					} else {
						moviesSection.innerHTML = `
							<button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="backToCategories()">
								<i class="fas fa-arrow-left"></i> Back to Categories
							</button>
							<h1 class="page-title">${genre}</h1>
							<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No movies found for this genre.</p>
						`;
					}
				})
				.catch(error => {
					console.error('[v0] Error loading movies:', error);
					moviesSection.innerHTML = `
						<button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="backToCategories()">
							<i class="fas fa-arrow-left"></i> Back to Categories
						</button>
						<h1 class="page-title">${genre}</h1>
						<p style="text-align: center; color: var(--error); padding: 2rem;">Error loading movies. Please try again.</p>
					`;
				});
		}

		function backToCategories() {
			const moviesSection = document.getElementById('moviesSection');
			if (moviesSection) {
				moviesSection.style.display = 'none';
			}
			document.getElementById('categoriesGrid').style.display = 'grid';
			document.querySelector('.trending-section').style.display = 'block';
		}

		function displayGenreMovies(container, genre, movies, source) {
			let html = `
				<button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="backToCategories()">
					<i class="fas fa-arrow-left"></i> Back to Categories
				</button>
				<h1 class="page-title" style="margin-bottom: 0.5rem;">
					<i class="fas fa-film"></i> ${genre}
				</h1>
				<p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Found ${movies.length} movies</p>
				<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem;">
			`;
			
			movies.forEach((movie, index) => {
				const title = movie.title || movie.movie_title || 'Unknown Movie';
				const rating = movie.rating || movie.imdb_score || 0;
				const movieSource = movie.source || source || 'Database';
				const director = movie.director || movie.director_name || 'Unknown Director';
				const genres = movie.genres || 'N/A';
				
				// Escape quotes for onclick handler
				const movieJson = JSON.stringify(movie).replace(/"/g, '&quot;');
				
				html += `
					<div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(229, 9, 20, 0.2); border-radius: 0.75rem; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; cursor: pointer;" 
					     onmouseover="this.style.transform='translateY(-8px)'; this.style.boxShadow='0 12px 30px rgba(229, 9, 20, 0.3)';"
					     onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';"
					     onclick="showMovieDetails('${movieJson}')"
					     style="cursor: pointer;">
						<div style="width: 100%; aspect-ratio: 2/3; background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(229, 9, 20, 0.1)); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-secondary);">
							🎬
						</div>
						<div style="padding: 1rem; display: flex; flex-direction: column; flex-grow: 1;">
							<div style="color: var(--text-primary); font-weight: 600; font-size: 0.85rem; line-height: 1.3; margin-bottom: 0.5rem; word-break: break-word; max-height: 2.5em; overflow: hidden;">
								${title}
							</div>
							<div style="color: var(--primary); font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem;">
								★ ${parseFloat(rating).toFixed(1)}/10
							</div>
							<div style="color: var(--text-secondary); font-size: 0.7rem; margin-top: auto;">
								${movieSource}
							</div>
						</div>
					</div>
				`;
			});
			
			html += '</div>';
			container.innerHTML = html;
			console.log('[v0] Display completed with', movies.length, 'movies');
		}

		function showMovieDetails(movieJson) {
			try {
				// Parse the escaped JSON
				const movie = JSON.parse(movieJson.replace(/&quot;/g, '"'));
				console.log('[v0] Showing details for:', movie);
				
				const title = movie.movie_title || movie.title || 'Unknown Movie';
				const rating = parseFloat(movie.imdb_score || movie.rating || 0).toFixed(1);
				const director = movie.director_name || movie.director || 'Unknown Director';
				const genres = movie.genres || 'N/A';
				const source = movie.source || 'Database';
				const cast = movie.cast || movie.actor_1_name || 'Unknown Cast';
				
				const modal = document.createElement('div');
				modal.id = 'movieModal';
				modal.style.cssText = `
					position: fixed;
					top: 0;
					left: 0;
					right: 0;
					bottom: 0;
					background: rgba(0, 0, 0, 0.8);
					display: flex;
					align-items: center;
					justify-content: center;
					z-index: 1000;
					backdrop-filter: blur(5px);
					overflow-y: auto;
					padding: 1rem;
				`;
				
				modal.innerHTML = `
					<div style="background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(229, 9, 20, 0.3); border-radius: 1rem; padding: 2rem; max-width: 600px; width: 100%; position: relative; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);">
						<button onclick="document.getElementById('movieModal').remove()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; transition: color 0.2s;">✕</button>
						
						<div style="display: grid; grid-template-columns: 200px 1fr; gap: 2rem; margin-bottom: 2rem;">
							<div style="width: 200px; aspect-ratio: 2/3; background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(229, 9, 20, 0.1)); display: flex; align-items: center; justify-content: center; font-size: 4rem; color: var(--text-secondary); border-radius: 0.5rem; border: 1px solid rgba(229, 9, 20, 0.2);">
								🎬
							</div>
							
							<div style="display: flex; flex-direction: column; justify-content: space-between;">
								<div>
									<h2 style="color: var(--text-primary); margin: 0 0 0.5rem 0; font-size: 1.75rem; text-balance; line-height: 1.2;">${title}</h2>
									<div style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">${genres}</div>
								</div>
								
								<div style="background: rgba(229, 9, 20, 0.15); border-left: 4px solid var(--primary); padding: 1rem; border-radius: 0.5rem;">
									<div style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Rating</div>
									<div style="color: var(--primary); font-size: 2.5rem; font-weight: bold;">★ ${rating}/10</div>
								</div>
							</div>
						</div>
						
						<div style="border-top: 1px solid rgba(229, 9, 20, 0.2); padding-top: 1.5rem; margin-bottom: 1.5rem;">
							<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
								<div>
									<div style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Director</div>
									<div style="color: var(--text-primary); font-weight: 500;">${director}</div>
								</div>
								<div>
									<div style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Source</div>
									<div style="color: var(--text-primary); font-weight: 500;">${source}</div>
								</div>
							</div>
							
							<div>
								<div style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Cast</div>
								<div style="color: var(--text-primary); font-weight: 500;">${cast}</div>
							</div>
						</div>
						
						<button onclick="document.getElementById('movieModal').remove()" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem; background-color: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600;">Close</button>
					</div>
				`;
				
				document.body.appendChild(modal);
				modal.onclick = function(e) {
					if (e.target === modal) {
						modal.remove();
					}
				};
			} catch (e) {
				console.error('[v0] Error showing movie details:', e);
				alert('Error loading movie details');
				}
			}
		}

		// Search functionality
		function performSearch() {
			const query = document.getElementById('searchInput').value.trim();
			if (!query) {
				alert('Please enter a search query');
				return;
			}

			console.log('[v0] Performing search for:', query);
			document.getElementById('searchResults').innerHTML = '<div style="text-align: center; color: var(--text-secondary);">Searching movies...</div>';
			document.getElementById('searchResults').style.display = 'block';

			fetch(`/api/search?q=${encodeURIComponent(query)}`)
				.then(response => response.json())
				.then(data => {
					console.log('[v0] Search results:', data);
					displaySearchResults(data);
				})
				.catch(error => {
					console.error('[v0] Search error:', error);
					document.getElementById('searchResults').innerHTML = '<div style="color: var(--error);">Error performing search. Please try again.</div>';
				});
		}

		function displaySearchResults(data) {
			const resultsDiv = document.getElementById('searchResults');
			let html = '';

			// Found movies section
			if (data.movies && data.movies.length > 0) {
				html += `
					<div class="results-section">
						<h3><i class="fas fa-film"></i> Found Movies (${data.movies.length})</h3>
						<div class="movie-grid">
				`;

				data.movies.forEach(movie => {
					const movieJson = JSON.stringify(movie).replace(/"/g, '&quot;');
					html += `
						<div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(229, 9, 20, 0.2); border-radius: 0.75rem; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; cursor: pointer;"
						     onmouseover="this.style.transform='translateY(-8px)'; this.style.boxShadow='0 12px 30px rgba(229, 9, 20, 0.3)';"
						     onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';"
						     onclick="showMovieDetails('${movieJson}')">
							<div style="width: 100%; aspect-ratio: 2/3; background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(229, 9, 20, 0.1)); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-secondary);">
								🎬
							</div>
							<div style="padding: 1rem;">
								<div style="color: var(--text-primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">${movie.movie_title}</div>
								<div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 0.5rem;">${movie.director_name}</div>
								<div style="color: var(--primary); font-weight: 700;">★ ${parseFloat(movie.imdb_score).toFixed(1)}/10</div>
							</div>
						</div>
					`;
				});

				html += '</div></div>';
			}

			// Similar/Recommended movies section
			if (data.similar && data.similar.length > 0) {
				html += `
					<div class="results-section">
						<h3><i class="fas fa-sparkles"></i> Recommended Similar Movies (${data.similar.length})</h3>
						<div class="movie-grid">
				`;

				data.similar.forEach(movie => {
					const movieJson = JSON.stringify(movie).replace(/"/g, '&quot;');
					html += `
						<div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(229, 9, 20, 0.2); border-radius: 0.75rem; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; cursor: pointer;"
						     onmouseover="this.style.transform='translateY(-8px)'; this.style.boxShadow='0 12px 30px rgba(229, 9, 20, 0.3)';"
						     onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';"
						     onclick="showMovieDetails('${movieJson}')">
							<div style="width: 100%; aspect-ratio: 2/3; background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(229, 9, 20, 0.1)); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-secondary);">
								🎬
							</div>
							<div style="padding: 1rem;">
								<div style="color: var(--text-primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">${movie.movie_title}</div>
								<div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 0.5rem;">${movie.director_name}</div>
								<div style="color: var(--primary); font-weight: 700;">★ ${parseFloat(movie.imdb_score).toFixed(1)}/10</div>
							</div>
						</div>
					`;
				});

				html += '</div></div>';
			}

			// No results
			if ((!data.movies || data.movies.length === 0) && (!data.similar || data.similar.length === 0)) {
				html = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No movies found matching your search. Try another title!</div>';
			}

			resultsDiv.innerHTML = html;
			console.log('[v0] Search results displayed');
		}

		// Allow Enter key to search
		document.addEventListener('keydown', function(event) {
			if (event.key === 'Enter' && document.activeElement.id === 'searchInput') {
				performSearch();
			}
		});
	</script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="{{url_for('static', filename='utils.js')}}"></script>
</body>
</html>
